# =============================================================================
# Two Ubuntu 24.04 boxes, node1 and node2, both running systemd as PID 1.
# Drive this with ./lab rather than calling docker compose directly.
# =============================================================================
name: lfca-lab

# Settings shared by both nodes. YAML anchors (&node-common / <<:) keep this
# file DRY — the two services below differ only in name and hostname.
x-node-common: &node-common
  build:
    context: .
    dockerfile: Dockerfile
    # Compose auto-loads .env from this directory. The :-lfca123 fallback means
    # a fresh clone with no .env still builds and works.
    args:
      STUDENT_PASSWORD: ${STUDENT_PASSWORD:-lfca123}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-lfca123}
  image: lfca-lab:24.04

  # Required for systemd. Docker mounts /sys/fs/cgroup read-only into an
  # unprivileged container, and systemd cannot manage services without writing
  # to it. Combined with Docker's default private cgroup namespace, the
  # container gets its own isolated cgroup tree — it cannot see or touch the
  # host's. This also gives you the capabilities needed to practise with ufw,
  # tcpdump and mount.
  privileged: true

  # systemd treats SIGTERM (Docker's default) as "reboot" and SIGRTMIN+3 as
  # "power off". Without this, ./lab stop appears to hang for 10s before Docker
  # SIGKILLs the box mid-shutdown.
  stop_signal: SIGRTMIN+3
  stop_grace_period: 20s

  # Your Mac's ./labs folder appears inside both boxes at /home/student/labs.
  # Edit in VS Code on the Mac, run in Linux. Survives stop, start and reset.
  volumes:
    - ./labs:/home/student/labs

  networks:
    - labnet

services:
  node1:
    <<: *node-common
    container_name: node1
    hostname: node1

  node2:
    <<: *node-common
    container_name: node2
    hostname: node2

networks:
  # A user-defined bridge (as opposed to the default one) gives you Docker's
  # embedded DNS, which is what makes `ping node2` resolve from inside node1.
  labnet:
    name: lfca-labnet
    driver: bridge
